# Builds pjproject (from the fork) and its dependencies, then tests RusTone,
# then builds the debug and release binaries.
#
# Stages, each a matrix over the platforms listed in the `platforms` job:
#   sdl2, openssl, openh264, amr  (in parallel, each cached; only platforms
#                                  that build their dependencies from source)
#     -> pjproject                (cached per fork commit)
#       -> test
#         -> build (debug, release; the release build also makes the
#            installers: NSIS + MSI, .deb + AppImage, .dmg)
#           -> release (version tags only: a draft GitHub Release)
# Linux and macOS take the dependencies from apt/Homebrew instead
# (.github/actions/system-deps).
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # lets a failed dependency cancel the run

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PJPROJECT_REPO: itsyourap/pjproject
  PJPROJECT_REF: rustone-2.17
  SDL2_VERSION: 2.32.10
  OPENH264_VERSION: 2.6.0
  # Bump to rebuild OpenSSL (vcpkg's current 3.x).
  OPENSSL_CACHE: v1
  CARGO_PACKAGER_VERSION: 0.11.8
  CARGO_TERM_COLOR: always

jobs:
  platforms:
    name: platforms
    runs-on: ubuntu-24.04
    outputs:
      all: ${{ steps.list.outputs.all }}
      deps: ${{ steps.list.outputs.deps }}
    steps:
      - id: list
        # name: artifact/cache suffix; os: runner image; target: Rust target;
        # source_deps: builds pjproject's dependencies in the jobs below.
        run: |
          all='[
            {"name": "windows-x64", "os": "windows-2025", "target": "x86_64-pc-windows-msvc", "source_deps": true},
            {"name": "linux-x64", "os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "source_deps": false},
            {"name": "macos-arm64", "os": "macos-15", "target": "aarch64-apple-darwin", "source_deps": false}
          ]'
          echo "all=$(jq -c . <<< "$all")" >> "$GITHUB_OUTPUT"
          echo "deps=$(jq -c 'map(select(.source_deps))' <<< "$all")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- deps --

  sdl2:
    name: SDL2 (${{ matrix.platform.name }})
    needs: platforms
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.deps) }}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - id: cache
        uses: actions/cache@v6
        with:
          path: _dep
          key: dep-${{ matrix.platform.name }}-sdl2-${{ env.SDL2_VERSION }}
      - name: Download (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _dep/include, _dep/lib, _dep/bin, _build | Out-Null
          curl.exe -fsSL --retry 3 -o _build/sdl2.zip "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip"
          Expand-Archive _build/sdl2.zip _build
          $sdl = "_build/SDL2-$env:SDL2_VERSION"
          Copy-Item "$sdl/include/*" _dep/include
          Copy-Item "$sdl/lib/x64/*.lib" _dep/lib
          Copy-Item "$sdl/lib/x64/SDL2.dll" _dep/bin
      - uses: actions/upload-artifact@v7
        with:
          name: dep-${{ matrix.platform.name }}-sdl2
          path: _dep
          retention-days: 1
      # The dependencies run side by side; one failing stops the others.
      - name: Stop the run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  openssl:
    name: OpenSSL (${{ matrix.platform.name }})
    needs: platforms
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.deps) }}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - id: cache
        uses: actions/cache@v6
        with:
          path: _dep
          key: dep-${{ matrix.platform.name }}-openssl-${{ env.OPENSSL_CACHE }}
      - name: Build with vcpkg (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows-release
          if ($LASTEXITCODE) { throw "vcpkg failed" }
          $ssl = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-release"
          New-Item -ItemType Directory -Force _dep/include, _dep/lib, _dep/bin | Out-Null
          Copy-Item -Recurse "$ssl/include/openssl" _dep/include
          Copy-Item "$ssl/lib/libcrypto.lib", "$ssl/lib/libssl.lib" _dep/lib
          Copy-Item "$ssl/bin/libcrypto-3-x64.dll", "$ssl/bin/libssl-3-x64.dll" _dep/bin
      - uses: actions/upload-artifact@v7
        with:
          name: dep-${{ matrix.platform.name }}-openssl
          path: _dep
          retention-days: 1
      # The dependencies run side by side; one failing stops the others.
      - name: Stop the run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  openh264:
    name: OpenH264 (${{ matrix.platform.name }})
    needs: platforms
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.deps) }}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v6
        with:
          path: _dep
          key: dep-${{ matrix.platform.name }}-openh264-${{ env.OPENH264_VERSION }}
      - name: Set up MSVC
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: ./.github/actions/msvc
      - name: Set up NASM (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          if ($LASTEXITCODE) { throw "choco install nasm failed" }
          "$env:ProgramFiles\NASM" >> $env:GITHUB_PATH
      - name: Build with meson
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          pip install meson ninja
          git clone --depth 1 --branch "v$env:OPENH264_VERSION" https://github.com/cisco/openh264 _build/openh264
          $extra = @()
          if ($IsWindows) { $extra += "-Db_vscrt=mt" }
          meson setup _build/openh264-build _build/openh264 "--prefix=$PWD/_dep" --libdir=lib --buildtype=release `
            -Ddefault_library=static -Dtests=disabled @extra
          if ($LASTEXITCODE) { throw "meson setup failed" }
          meson install -C _build/openh264-build
          if ($LASTEXITCODE) { throw "meson install failed" }
          # pjproject links "openh264.lib"; meson names static libraries lib*.a.
          if ($IsWindows) { Move-Item -Force _dep/lib/libopenh264.a _dep/lib/openh264.lib }
      - uses: actions/upload-artifact@v7
        with:
          name: dep-${{ matrix.platform.name }}-openh264
          path: _dep
          retention-days: 1
      # The dependencies run side by side; one failing stops the others.
      - name: Stop the run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  amr:
    name: ${{ matrix.package.name }} (${{ matrix.platform.name }})
    needs: platforms
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.deps) }}
        package:
          - { name: opencore-amr, version: 0.1.6 }
          - { name: vo-amrwbenc, version: 0.1.3 }
    runs-on: ${{ matrix.platform.os }}
    env:
      PKG_NAME: ${{ matrix.package.name }}
      PKG_VERSION: ${{ matrix.package.version }}
    steps:
      - id: cache
        uses: actions/cache@v6
        with:
          path: _dep
          key: dep-${{ matrix.platform.name }}-${{ env.PKG_NAME }}-${{ env.PKG_VERSION }}
      # pjproject's MSVC build links the GCC-built static libraries
      # (PJMEDIA_OPENCORE_AMR_BUILT_WITH_GCC); UCRT64 matches MSVC's CRT.
      - name: Set up MSYS2 (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          # Only runs when the library isn't cached; both AMR jobs would also
          # race to save the same package cache.
          cache: false
          install: make curl tar
          pacboy: gcc:p
      - name: Build (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          prefix=$(cygpath -u "$GITHUB_WORKSPACE/_dep")
          mkdir -p _build && cd _build
          src="$PKG_NAME-$PKG_VERSION"
          curl -fsSL --retry 3 -o "$src.tar.gz" "https://downloads.sourceforge.net/project/opencore-amr/$PKG_NAME/$src.tar.gz"
          tar xzf "$src.tar.gz"
          cd "$src"
          ./configure --prefix="$prefix" --enable-static --disable-shared
          make -j4
          make install
          # GCC calls ___chkstk_ms for large stack frames; MSVC's linker can't
          # find it, so add libgcc's object to the archive that needs it
          # (https://docs.pjsip.org/en/latest/specific-guides/audio/opencore-amr.html#windows).
          ar x "$(gcc -print-libgcc-file-name)" _chkstk_ms.o
          for lib in "$prefix"/lib/*.a; do
            if nm "$lib" 2>/dev/null | grep -q "U ___chkstk_ms"; then
              echo "adding _chkstk_ms.o to $(basename "$lib")"
              ar q "$lib" _chkstk_ms.o
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dep-${{ matrix.platform.name }}-${{ env.PKG_NAME }}
          path: _dep
          retention-days: 1
      # The dependencies run side by side; one failing stops the others.
      - name: Stop the run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  # ----------------------------------------------------------- pjproject --

  pjproject:
    name: pjproject (${{ matrix.platform.name }})
    needs: [platforms, sdl2, openssl, openh264, amr]
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.all) }}
    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - if: matrix.platform.source_deps
        uses: actions/download-artifact@v8
        with:
          pattern: dep-${{ matrix.platform.name }}-*
          path: _sdk/deps
          merge-multiple: true

      - name: Resolve the pjproject commit
        id: pj
        run: |
          $sha = (git ls-remote "https://github.com/$env:PJPROJECT_REPO" "refs/heads/$env:PJPROJECT_REF").Split()[0]
          if (-not $sha) { throw "branch $env:PJPROJECT_REF not found" }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - id: cache
        uses: actions/cache@v6
        with:
          path: _sdk/pjproject
          # The fork's commit, our config_site.h, the build scripts and the
          # dependencies built above.
          key: pjproject-${{ matrix.platform.name }}-${{ steps.pj.outputs.sha }}-${{ hashFiles('crates/pjsua-sys/config_site.h', '.github/scripts/*', '_sdk/deps/**') }}

      - name: System dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/system-deps

      - name: Set up MSVC
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: ./.github/actions/msvc

      - name: Fetch the fork
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch $env:PJPROJECT_REF "https://github.com/$env:PJPROJECT_REPO" _build/pjproject
          git -C _build/pjproject checkout ${{ steps.pj.outputs.sha }}
          Copy-Item crates/pjsua-sys/config_site.h _build/pjproject/pjlib/include/pj/config_site.h

      - name: Build (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: |
          $deps = "$env:GITHUB_WORKSPACE\_sdk\deps"
          @"
          <Project>
            <ItemDefinitionGroup>
              <ClCompile><AdditionalIncludeDirectories>$deps\include;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories></ClCompile>
              <Link><AdditionalLibraryDirectories>$deps\lib;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories></Link>
            </ItemDefinitionGroup>
          </Project>
          "@ | Set-Content _build/pjproject/Directory.Build.props
          msbuild _build/pjproject/pjproject-vs14.sln /t:libpjproject /p:Configuration=Release-Static /p:Platform=x64 /m /v:minimal
          if ($LASTEXITCODE) { throw "msbuild failed" }

      - name: Build and install (Linux, macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/build-pjproject.sh _build/pjproject _sdk/pjproject crates/pjsua-sys/config_site.h

      - name: Stage headers and libraries (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: |
          $src = "_build/pjproject"
          $dst = "_sdk/pjproject"
          foreach ($m in "pjlib", "pjlib-util", "pjnath", "pjmedia", "pjsip") {
            New-Item -ItemType Directory -Force "$dst/$m" | Out-Null
            Copy-Item -Recurse "$src/$m/include" "$dst/$m/include"
          }
          New-Item -ItemType Directory -Force "$dst/lib", "$dst/third_party/lib" | Out-Null
          Copy-Item "$src/lib/*.lib" "$dst/lib"
          Copy-Item "$src/third_party/lib/*.lib" "$dst/third_party/lib"

      - name: SDK size
        run: |
          Get-ChildItem -Recurse _sdk -File | Measure-Object -Sum Length | ForEach-Object { "SDK: $($_.Count) files, $([math]::Round($_.Sum / 1MB)) MB" }

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.platform.name }}
          path: _sdk
          retention-days: 1

  # ----------------------------------------------------------------- app --

  test:
    name: test (${{ matrix.platform.name }})
    needs: [platforms, pjproject]
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.all) }}
    runs-on: ${{ matrix.platform.os }}
    env:
      PJPROJECT_DIR: ${{ github.workspace }}/_sdk/pjproject
      RUSTONE_DEPS_DIR: ${{ github.workspace }}/_sdk/deps
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sdk-${{ matrix.platform.name }}
          path: _sdk
      - uses: ./.github/actions/system-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.name }}-test
      # The committed bindings must match what bindgen makes from this
      # pjproject build. A new target's file is uploaded to commit.
      - name: Bindings are current (Linux, macOS)
        id: bindings
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build -p pjsua-sys --features regen --locked
          if [ -n "$(git status --porcelain crates/pjsua-sys/src/bindings)" ]; then
            git status --short crates/pjsua-sys/src/bindings
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.bindings.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.platform.name }}
          path: crates/pjsua-sys/src/bindings/
          if-no-files-found: error
      - if: steps.bindings.outputs.changed == 'true'
        shell: bash
        run: |
          echo "::error::crates/pjsua-sys/src/bindings is out of date for ${{ matrix.platform.target }}; commit the uploaded bindings-${{ matrix.platform.name }} artifact"
          exit 1
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.platform.name }}, ${{ matrix.profile }})
    needs: [platforms, test]
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.all) }}
        profile: [debug, release]
    runs-on: ${{ matrix.platform.os }}
    env:
      PJPROJECT_DIR: ${{ github.workspace }}/_sdk/pjproject
      RUSTONE_DEPS_DIR: ${{ github.workspace }}/_sdk/deps
      DIST: dist/rustone-${{ matrix.platform.name }}-${{ matrix.profile }}
      PACKAGES: dist/packages
      # Optional signing: packages are signed only when these secrets exist.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sdk-${{ matrix.platform.name }}
          path: _sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.name }}-${{ matrix.profile }}
      - uses: ./.github/actions/system-deps
      - name: Build
        shell: pwsh
        run: |
          $flags = @("--workspace", "--locked")
          if ("${{ matrix.profile }}" -eq "release") { $flags += "--release" }
          cargo build @flags
          if ($LASTEXITCODE) { throw "cargo build failed" }
      - name: Collect binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.profile }}"
          New-Item -ItemType Directory -Force $env:DIST | Out-Null
          Copy-Item "$bin/rustone.exe", "$bin/rustone-cli.exe", "$bin/rustone.pdb", "$bin/rustone_cli.pdb", "$bin/*.dll" $env:DIST
      - name: Collect binaries (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$DIST"
          cp "target/${{ matrix.profile }}/rustone" "target/${{ matrix.profile }}/rustone-cli" "$DIST/"
      - uses: actions/upload-artifact@v7
        with:
          name: rustone-${{ matrix.platform.name }}-${{ matrix.profile }}
          path: ${{ env.DIST }}

      # ------------------------------------------------ installers (release) --
      - name: Install cargo-packager
        if: matrix.profile == 'release'
        shell: bash
        run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      - name: Set up MSVC (Windows signing)
        if: matrix.profile == 'release' && runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        uses: ./.github/actions/msvc
      - name: Sign the binaries (Windows)
        if: matrix.profile == 'release' && runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: ./packaging/windows/sign.ps1 target/release/rustone.exe, target/release/rustone-cli.exe
      - name: Installers (Windows)
        if: matrix.profile == 'release' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo packager -p rustone-app --release -f nsis,wix -o $env:PACKAGES
          if ($LASTEXITCODE) { throw "cargo packager failed" }
          if ($env:WINDOWS_CERTIFICATE) {
            ./packaging/windows/sign.ps1 (Get-ChildItem $env:PACKAGES -File -Include *.exe, *.msi -Recurse).FullName
          }

      - name: Installers (Linux)
        if: matrix.profile == 'release' && runner.os == 'Linux'
        shell: bash
        env:
          # linuxdeploy is an AppImage; the runner has no FUSE for it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          sudo apt-get install -y -q --no-install-recommends file squashfs-tools
          # The installed program needs no debug info (the build artifact
          # above keeps it).
          strip target/release/rustone target/release/rustone-cli
          cargo packager -p rustone-app --release -f deb,appimage -o "$PACKAGES"

      - name: Signing keychain (macOS)
        if: matrix.profile == 'release' && runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Installers (macOS)
        if: matrix.profile == 'release' && runner.os == 'macOS'
        shell: bash
        run: |
          strip -S target/release/rustone target/release/rustone-cli
          cargo packager -p rustone-app --release -f app -o "$PACKAGES"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustone-app") | .version')
          dmg="$PACKAGES/RusTone_${version}_aarch64.dmg"
          bash packaging/macos/bundle.sh "$PACKAGES/RusTone.app" "$dmg"
          if [ -n "$APPLE_ID" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          fi
          # The .dmg carries the app; don't upload the bundle on its own.
          rm -rf "$PACKAGES/RusTone.app"

      - name: Upload the installers
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.platform.name }}
          # cargo-packager keeps its downloaded tools in .cargo-packager.
          path: |
            ${{ env.PACKAGES }}/*
            !${{ env.PACKAGES }}/.cargo-packager
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustone-app") | .version')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the version $version in Cargo.toml"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes --title "RusTone ${GITHUB_REF_NAME#v}"
