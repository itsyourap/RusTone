# Builds, tests and packages RusTone on every platform in `platforms`, then
# (for version tags) drafts a GitHub Release with the installers.
#
# Each platform runs its own chain (platform.yml: dependencies -> pjproject
# -> test -> build and installers). The chains are independent: one
# platform failing doesn't stop the others. Only the release needs them all.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    name: platforms
    runs-on: ubuntu-24.04
    outputs:
      all: ${{ steps.list.outputs.all }}
    steps:
      - id: list
        # name: artifact/cache suffix; os: runner image; target: Rust target;
        # source_deps: builds pjproject's dependencies from source.
        run: |
          all='[
            {"name": "windows-x64", "os": "windows-2025", "target": "x86_64-pc-windows-msvc", "source_deps": true},
            {"name": "linux-x64", "os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "source_deps": false},
            {"name": "macos-arm64", "os": "macos-15", "target": "aarch64-apple-darwin", "source_deps": false}
          ]'
          echo "all=$(jq -c . <<< "$all")" >> "$GITHUB_OUTPUT"

  platform:
    name: ${{ matrix.platform.name }}
    needs: platforms
    strategy:
      # Independent chains: a failing platform leaves the others running.
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.all) }}
    uses: ./.github/workflows/platform.yml
    with:
      name: ${{ matrix.platform.name }}
      os: ${{ matrix.platform.os }}
      target: ${{ matrix.platform.target }}
      source-deps: ${{ matrix.platform.source_deps }}
    secrets: inherit

  release:
    name: release
    # Every platform's installers, so a failing chain blocks the release.
    needs: platform
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustone-app") | .version')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the version $version in Cargo.toml"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes --title "RusTone ${GITHUB_REF_NAME#v}"
