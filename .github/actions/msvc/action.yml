# Puts the MSVC toolchain (cl, link, msbuild) for the runner's architecture
# (x64 or ARM64) on the job's PATH and
# environment, like a "Developer PowerShell". Replaces ilammy/msvc-dev-cmd,
# which still runs on Node.js 20.
name: MSVC environment
description: Exports the Visual Studio developer environment for the runner's architecture.
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        # The runner's own architecture: x64 runners build x64, ARM64 runners ARM64.
        if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") {
          $arch = "arm64"; $component = "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
        } else {
          $arch = "amd64"; $component = "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
        }
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires $component -property installationPath
        if (-not $vs) { throw "Visual Studio with the C++ $arch tools not found" }
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        $lines = cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=$arch -host_arch=$arch -no_logo && set"
        if ($LASTEXITCODE) { throw "VsDevCmd.bat failed" }
        foreach ($line in $lines) {
          if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
            "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
          }
        }
        Write-Host "MSVC from $vs"
