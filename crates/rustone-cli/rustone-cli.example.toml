# Copy to rustone-cli.toml (git-ignored) and fill in your account.

[account]
server = "sip.example.com"        # registrar
proxy = ""                        # outbound proxy(s), space-separated
domain = ""                       # appended to numbers that have no "@"
username = "1001@sip.example.com"
password = ""
auth_id = ""                      # defaults to username
display_name = ""
transport = "tls"                 # udp | tcp | tls
srtp = ""                         # "" | optional | mandatory | dtls | dtls-sdes
register_refresh = 86400
keep_alive = 15
publish = false
ice = false
allow_rewrite = false
disable_session_timer = false

[settings]
user_agent = ""                   # empty = "RusTone/<version>"
rport = true
source_port = 0
rtp_port_min = 52000
rtp_port_max = 52200
audio_codecs = "G722/16000/1 PCMU/8000/1 PCMA/8000/1"
vad = false
ec = false
log_file = "rustone-cli.log"
