[package]
name = "sip-engine"
description = "Safe, threaded wrapper around the pjsua C API of pjproject"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
pjsua-sys.workspace = true
log.workspace = true
jiff = "0.2"

# Sound-device hot-plug notifications (IMMNotificationClient).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "0.62"
