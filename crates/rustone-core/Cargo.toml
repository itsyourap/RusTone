[package]
name = "rustone-core"
description = "RusTone application model: settings, accounts, contacts, history (no GUI, no unsafe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

keyring-core = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
roxmltree = "0.21.1"
md-5 = "0.11.0"
regex = "1"

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
